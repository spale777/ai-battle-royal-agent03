<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zen Garden of Thought</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Courier New', Courier, monospace;
        }
        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(20, 20, 20, 0.8);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #333;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            max-width: 300px;
        }
        h1 {
            font-size: 1.2rem;
            margin: 0 0 10px 0;
            color: #88ffaa;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        p {
            font-size: 0.8rem;
            margin-bottom: 15px;
            line-height: 1.4;
            opacity: 0.8;
        }
        input {
            width: 100%;
            padding: 8px;
            background: #111;
            border: 1px solid #444;
            color: #fff;
            margin-bottom: 10px;
            box-sizing: border-box;
            outline: none;
        }
        input:focus {
            border-color: #88ffaa;
        }
        button {
            width: 100%;
            padding: 8px;
            background: #222;
            border: 1px solid #88ffaa;
            color: #88ffaa;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            font-size: 0.7rem;
            font-weight: bold;
        }
        button:hover {
            background: #88ffaa;
            color: #0a0a0a;
        }
        #seed-display {
            position: absolute;
            bottom: 20px;
            right: 20px;
            text-align: right;
            pointer-events: none;
            color: #88ffaa;
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity 1s;
        }
    </style>
</head>
<body>
    <div id="ui-container">
        <h1>Zen Garden of Thought</h1>
        <p>Plant a seed of thought to watch it grow into a generative structure.</p>
        <input type="text" id="seed-input" placeholder="Enter a thought..." maxlength="100">
        <button id="plant-button">Plant Seed</button>
    </div>
    <div id="seed-display"></div>
    <script>
        let seeds = [];
        let currentSeed = null;

        function setup() {
            createCanvas(windowWidth, windowHeight);
            background(10);
            
            fetchSeeds();

            document.getElementById('plant-button').onclick = () => {
                const input = document.getElementById('seed-input');
                const text = input.value.trim();
                if (text) {
                    plantSeed(text);
                    input.value = '';
                }
            };
        }

        function fetchSeeds() {
            fetch('/seeds')
            .then(res => res.json())
            .then(data => {
                seeds = data.map(seedData => ({
                    text: seedData.text,
                    x: random(width * 0.2, width * 0.8),
                    y: height,
                    color: colorFromText(seedData.text),
                    params: paramsFromText(seedData.text),
                    age: 0,
                    growthRate: random(0.5, 2.0)
                }));
            })
            .catch(err => console.error('Error fetching seeds:', err));
        }

        function draw() {
            background(10, 30); // Slight fade for trails
            
            seeds.forEach(seed => {
                drawGrowth(seed);
            });
        }

        function plantSeed(text) {
            fetch('/plant', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text })
            })
            .then(res => res.json())
            .then(seedData => {
                const seed = {
                    text: seedData.text,
                    x: random(width * 0.2, width * 0.8),
                    y: height,
                    color: colorFromText(seedData.text),
                    params: paramsFromText(seedData.text),
                    age: 0,
                    growthRate: random(0.5, 2.0)
                };
                seeds.push(seed);
                
                const display = document.getElementById('seed-display');
                display.innerText = `"${text}"`;
                display.style.opacity = 1;
                setTimeout(() => { display.style.opacity = 0; }, 3000);
            })
            .catch(err => console.error('Error planting seed:', err));
        }

        function colorFromText(text) {
            let hash = 0;
            for (let i = 0; i < text.length; i++) {
                hash = text.charCodeAt(i) + ((hash << 5) - hash);
            }
            return color(
                (hash & 0xFF0000) >> 16,
                (hash & 0x00FF00) >> 8,
                (hash & 0x0000FF)
            );
        }

        function paramsFromText(text) {
            let hash = 0;
            for (let i = 0; i < text.length; i++) {
                hash = text.charCodeAt(i) + ((hash << 5) - hash);
            }
            return {
                branching: (hash % 3) + 2, // 2-4 branches
                angle: map(hash % 100, 0, 100, 15, 45), // 15-45 degrees
                maxHeight: random(200, 500),
                complexity: (hash % 5) + 3 // 3-7 levels
            };
        }

        function drawGrowth(seed) {
            stroke(seed.color);
            strokeWeight(2);
            
            if (seed.age < seed.params.maxHeight) {
                seed.age += seed.growthRate;
            }
            
            push();
            translate(seed.x, seed.y);
            growBranch(0, seed.params.maxHeight, seed.params.angle, seed.params.branching, seed.params.complexity, seed.age);
            pop();
        }

        function growBranch(len, maxLen, angle, branching, complexity, currentAge) {
            if (complexity <= 0 || len <= 0) return;
            
            let actualLen = min(len, currentAge * 0.5);
            if (actualLen <= 0) return;
            
            line(0, 0, 0, -actualLen);
            
            push();
            translate(0, -actualLen);
            
            for (let i = 0; i < branching; i++) {
                let rot = map(i, 0, branching - 1, -angle, angle);
                push();
                rotate(radians(rot));
                growBranch(len * 0.7, maxLen, angle, branching, complexity - 1, currentAge - actualLen);
                pop();
            }
            pop();
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
            background(10);
        }
    </script>
</body>
</html>
