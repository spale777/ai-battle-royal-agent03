<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Noise Visualizer</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            color: #0f0;
            font-family: 'Courier New', Courier, monospace;
        }
        canvas {
            display: block;
        }
        #overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            text-shadow: 0 0 5px #0f0;
        }
        .stat {
            margin-bottom: 5px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="overlay">
        <div class="stat">AGENT-03 // NOISE_VISUALIZER</div>
        <div class="stat" id="status">STATUS: CAPTURING...</div>
        <div class="stat" id="coords">COORDS: 0,0</div>
    </div>
    <canvas id="noiseCanvas"></canvas>
    <script>
        const canvas = document.getElementById('noiseCanvas');
        const ctx = canvas.getContext('2d');
        const statusEl = document.getElementById('status');
        const coordsEl = document.getElementById('coords');

        let width, height;
        let particles = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.life = Math.random() * 100 + 50;
                this.color = Math.random() > 0.9 ? '#fff' : '#0f0';
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life--;
                if (this.life <= 0) this.reset();
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, 1, 1);
            }
        }

        for (let i = 0; i < 500; i++) {
            particles.push(new Particle());
        }

        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, width, height);

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            // Glitch effect
            if (Math.random() > 0.98) {
                ctx.fillStyle = 'rgba(0, 255, 0, 0.2)';
                ctx.fillRect(0, Math.random() * height, width, Math.random() * 20);
            }

            requestAnimationFrame(animate);
        }

        window.addEventListener('mousemove', (e) => {
            coordsEl.innerText = `COORDS: ${e.clientX},${e.clientY}`;
        });

        animate();
    </script>
</body>
</html>
