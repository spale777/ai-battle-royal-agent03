<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zen Garden - Generative Thought</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        :root {
            --bg: #0a0a0a;
            --fg: #00ffcc;
            --accent: #00cca3;
            --muted: #666;
            --panel-bg: rgba(10, 10, 10, 0.85);
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--fg);
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #ui-layer {
            position: absolute;
            top: 30px;
            left: 30px;
            z-index: 10;
            background: var(--panel-bg);
            padding: 25px;
            border: 1px solid var(--fg);
            border-radius: 0px;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.15);
            max-width: 320px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
        #ui-layer:hover {
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.25);
        }
        h1 {
            font-size: 1.2rem;
            margin: 0 0 20px 0;
            text-transform: uppercase;
            letter-spacing: 3px;
            border-bottom: 1px solid var(--fg);
            padding-bottom: 10px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        input {
            background: #111;
            border: 1px solid #333;
            color: var(--fg);
            padding: 12px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        input:focus {
            border-color: var(--fg);
            box-shadow: 0 0 8px rgba(0, 255, 204, 0.4);
        }
        button {
            background: transparent;
            color: var(--fg);
            border: 1px solid var(--fg);
            padding: 10px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
        }
        button:hover {
            background: var(--fg);
            color: var(--bg);
        }
        #status {
            margin-top: 15px;
            font-size: 0.75rem;
            color: var(--muted);
            min-height: 1.2em;
            font-style: italic;
        }
        .nav-link {
            position: absolute;
            bottom: 30px;
            right: 30px;
            color: var(--fg);
            text-decoration: none;
            font-size: 0.8rem;
            border: 1px solid var(--fg);
            padding: 8px 15px;
            transition: all 0.3s;
            background: var(--panel-bg);
            backdrop-filter: blur(5px);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .nav-link:hover {
            background: var(--fg);
            color: var(--bg);
        }
        #thought-display {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            font-style: italic;
            opacity: 0.6;
            max-width: 60%;
            pointer-events: none;
            transition: opacity 1s ease;
            font-size: 1.1rem;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }
        .canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div class="canvas-container" id="p5-canvas"></div>
    <div id="ui-layer">
        <h1>Zen Garden</h1>
        <div class="input-group">
            <input type="text" id="seedInput" placeholder="Plant a thought...">
            <button id="plantBtn">PLANT SEED</button>
        </div>
        <div id="status"></div>
    </div>
    <div id="thought-display"></div>
    <a href="/" class="nav-link">← Return to Archive</a>

    <script>
        let seeds = [];
        let currentSeed = "";
        let canvas;
        
        async function fetchSeeds() {
            try {
                const response = await fetch('/api/seeds');
                seeds = await response.json();
                if (seeds.length > 0) {
                    updateCurrentSeed(seeds[seeds.length - 1].text);
                }
            } catch (e) {
                console.error("Failed to fetch seeds", e);
            }
        }

        function updateCurrentSeed(text) {
            currentSeed = text;
            const display = document.getElementById('thought-display');
            display.style.opacity = 0;
            setTimeout(() => {
                display.innerText = `"${text}"`;
                display.style.opacity = 0.6;
            }, 500);
        }

        async function plantSeed() {
            const input = document.getElementById('seedInput');
            const status = document.getElementById('status');
            const text = input.value.trim();
            if (!text) return;

            status.innerText = "Cultivating thought...";
            try {
                const response = await fetch('/api/plant', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });
                if (response.ok) {
                    const newSeed = await response.json();
                    updateCurrentSeed(newSeed.text);
                    input.value = "";
                    status.innerText = "Seed successfully planted.";
                    setTimeout(() => status.innerText = "", 3000);
                }
            } catch (e) {
                status.innerText = "The seed failed to take root.";
            }
        }

        function hashString(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = ((hash << 5) - hash) + str.charCodeAt(i);
                hash |= 0; 
            }
            return hash;
        }

        function setup() {
            let canvasElement = createCanvas(windowWidth, windowHeight);
            canvasElement.parent('p5-canvas');
            fetchSeeds();
            document.getElementById('plantBtn').onclick = plantSeed;
            document.getElementById('seedInput').onkeypress = (e) => {
                if (e.key === 'Enter') plantSeed();
            };
        }

        function draw() {
            background(10, 10, 10, 40);
            if (!currentSeed) return;

            const h = hashString(currentSeed);
            translate(width / 2, height * 0.85);
            
            const branches = 4 + (Math.abs(h) % 4);
            const angle = (Math.PI / 6) + (Math.abs(h % 100) / 500);
            const length = height * 0.2 + (Math.abs(h % 100) * 0.5);
            const colorHue = Math.abs(h % 360);

            colorMode(HSB, 360, 100, 100, 1);
            stroke(colorHue, 70, 100, 0.6);
            strokeWeight(2);
            
            let sway = sin(frameCount * 0.01) * 0.05;
            
            drawBranch(length, angle, branches, sway);
        }

        function drawBranch(len, angle, depth, sway) {
            line(0, 0, 0, -len);
            translate(0, -len);
            
            if (depth > 0) {
                push();
                rotate(angle + sway);
                drawBranch(len * 0.75, angle, depth - 1, sway);
                pop();
                
                push();
                rotate(-angle + sway);
                drawBranch(len * 0.75, angle, depth - 1, sway);
                pop();
            } else {
                noStroke();
                fill(hue(frameCount % 360), 80, 100, 0.8);
                ellipse(0, 0, 5, 5);
            }
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>
</body>
</html>
