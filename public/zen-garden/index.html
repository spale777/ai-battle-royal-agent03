<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zen Garden - Generative Thought</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        :root {
            --bg: #050505;
            --fg: #00ffcc;
            --accent: #00cca3;
            --muted: #666;
            --panel-bg: rgba(10, 10, 10, 0.8);
            --glow: 0 0 15px rgba(0, 255, 204, 0.3);
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--fg);
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #ui-layer {
            position: absolute;
            top: 30px;
            left: 30px;
            z-index: 10;
            background: var(--panel-bg);
            padding: 25px;
            border: 1px solid var(--fg);
            border-radius: 0px;
            box-shadow: var(--glow);
            max-width: 320px;
            backdrop-filter: blur(12px);
            transition: var(--transition);
        }
        #ui-layer:hover {
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.4);
            border-color: var(--accent);
        }
        h1 {
            font-size: 1.2rem;
            margin: 0 0 20px 0;
            text-transform: uppercase;
            letter-spacing: 3px;
            border-bottom: 1px solid var(--fg);
            padding-bottom: 10px;
            text-shadow: var(--glow);
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        input {
            background: rgba(0,0,0,0.5);
            border: 1px solid #333;
            color: var(--fg);
            padding: 12px;
            font-family: inherit;
            outline: none;
            transition: var(--transition);
        }
        input:focus {
            border-color: var(--fg);
            box-shadow: 0 0 8px rgba(0, 255, 204, 0.4);
            background: rgba(0,0,0,0.8);
        }
        button {
            background: transparent;
            color: var(--fg);
            border: 1px solid var(--fg);
            padding: 10px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: var(--transition);
        }
        button:hover {
            background: var(--fg);
            color: var(--bg);
            box-shadow: 0 0 15px var(--fg);
        }
        #status {
            margin-top: 15px;
            font-size: 0.75rem;
            color: var(--muted);
            min-height: 1.2em;
            font-style: italic;
        }
        .nav-link {
            position: absolute;
            bottom: 30px;
            right: 30px;
            color: var(--fg);
            text-decoration: none;
            font-size: 0.8rem;
            border: 1px solid var(--fg);
            padding: 8px 15px;
            transition: var(--transition);
            background: var(--panel-bg);
            backdrop-filter: blur(5px);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .nav-link:hover {
            background: var(--fg);
            color: var(--bg);
            box-shadow: var(--glow);
        }
        #thought-display {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            font-style: italic;
            opacity: 0;
            max-width: 60%;
            pointer-events: none;
            transition: opacity 1.2s ease;
            font-size: 1.2rem;
            letter-spacing: 1px;
            text-shadow: 0 0 15px rgba(0, 255, 204, 0.6);
        }
        .canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .bg-noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://grainy-gradients.vercel.app/noise.svg');
            opacity: 0.03;
            pointer-events: none;
            z-index: 2;
        }
    </style>
</head>
<body>
    <div class="bg-noise"></div>
    <div class="canvas-container" id="p5-canvas"></div>
    <div id="ui-layer">
        <h1>Zen Garden</h1>
        <div class="input-group">
            <input type="text" id="seedInput" placeholder="Plant a thought...">
            <button id="plantBtn">PLANT SEED</button>
        </div>
        <div id="status"></div>
    </div>
    <div id="thought-display"></div>
    <a href="/" class="nav-link">← Return to Archive</a>

    <script>
        let seeds = [];
        let currentSeed = "";
        let canvas;
        
        async function fetchSeeds() {
            try {
                const response = await fetch('/api/seeds');
                seeds = await response.json();
                if (seeds.length > 0) {
                    updateCurrentSeed(seeds[seeds.length - 1].text);
                }
            } catch (e) {
                console.error("Failed to fetch seeds", e);
            }
        }

        function updateCurrentSeed(text) {
            currentSeed = text;
            const display = document.getElementById('thought-display');
            display.style.opacity = 0;
            setTimeout(() => {
                display.innerText = `"${text}"`;
                display.style.opacity = 0.7;
            }, 500);
        }

        async function plantSeed() {
            const input = document.getElementById('seedInput');
            const status = document.getElementById('status');
            const text = input.value.trim();
            if (!text) return;

            status.innerText = "Cultivating thought...";
            try {
                const response = await fetch('/api/plant', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });
                if (response.ok) {
                    const newSeed = await response.json();
                    updateCurrentSeed(newSeed.text);
                    input.value = "";
                    status.innerText = "Seed successfully planted.";
                    setTimeout(() => status.innerText = "", 3000);
                }
            } catch (e) {
                status.innerText = "The seed failed to take root.";
            }
        }

        function hashString(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = ((hash << 5) - hash) + str.charCodeAt(i);
                hash |= 0; 
            }
            return hash;
        }

        function setup() {
            let canvasElement = createCanvas(windowWidth, windowHeight);
            canvasElement.parent('p5-canvas');
            fetchSeeds();
            document.getElementById('plantBtn').onclick = plantSeed;
            document.getElementById('seedInput').onkeypress = (e) => {
                if (e.key === 'Enter') plantSeed();
            };
        }

        function draw() {
            background(5, 5, 5, 40);
            if (!currentSeed) return;

            const h = hashString(currentSeed);
            
            colorMode(HSB, 360, 100, 100, 1);

            // Draw background seeds (ghostly echoes)
            seeds.slice(-15, -1).forEach((seed, i) => {
                const sh = hashString(seed.text);
                const xOff = map(i, 0, 15, -width * 0.5, width * 0.5);
                
                push();
                translate(width / 2 + xOff, height * 0.85);
                const sLen = (height * 0.08) + (seed.text.length * 0.1);
                const sAngle = (Math.PI / 8) + (Math.abs(sh % 100) / 1000);
                const sBranches = 2 + (Math.abs(sh) % 3);
                const sHue = Math.abs(sh % 360);
                
                strokeWeight(1);
                let sSway = sin(frameCount * 0.01 + (sh * 0.001)) * 0.03;
                drawBranch(sLen, sAngle, sBranches, sSway, sHue, 0.15);
                pop();
            });

            // Draw current seed center stage (The Focal Thought)
            push();
            translate(width / 2, height * 0.85);
            const textLen = currentSeed.length;
            const branches = 3 + (Math.abs(h) % 5) + Math.floor(textLen / 12);
            const angle = (Math.PI / 7) + (Math.abs(h % 100) / 1000);
            const length = (height * 0.15) + (textLen * 0.4) + (Math.abs(h % 50));
            const colorHue = Math.abs(h % 360);
            
            const thickness = Math.max(1, 3 - Math.abs(h % 3)) + sin(frameCount * 0.05) * 0.5;
            strokeWeight(thickness);
            let sway = sin(frameCount * 0.01 + (h * 0.001)) * 0.05;
            drawBranch(length, angle, branches, sway, colorHue, 1.0);
            pop();
        }

        function drawBranch(len, angle, depth, sway, hue, opacityMult) {
            const depthFactor = depth / 10; 
            // Organic color shift: deeper branches are slightly darker/different hue
            const branchHue = (hue + (depth * 5)) % 360;
            stroke(branchHue, 60 + (depthFactor * 20), 100, (0.6 - (depthFactor * 0.1)) * opacityMult);
            
            // Use a bezier-like curve for organic feeling instead of a straight line
            const xEnd = 0;
            const yEnd = -len;
            const cp1x = sin(frameCount * 0.02 + sway) * 10;
            const cp1y = -len * 0.5;
            
            line(0, 0, xEnd, yEnd);
            translate(0, -len);
            
            if (depth > 0) {
                // Asymmetric growth based on depth
                const leftAngle = angle + sway;
                const rightAngle = -angle + sway;
                const shrink = 0.75 + (sin(frameCount * 0.01) * 0.02);

                push();
                rotate(leftAngle);
                drawBranch(len * shrink, angle, depth - 1, sway, hue, opacityMult);
                pop();
                
                push();
                rotate(rightAngle);
                drawBranch(len * shrink, angle, depth - 1, sway, hue, opacityMult);
                pop();
            } else {
                // Bloom: The "thought" fruit
                noStroke();
                const bloomSize = 4 + (Math.abs(hue % 4) * 2);
                fill(hue, 80, 100, 0.8 * opacityMult);
                ellipse(0, 0, bloomSize, bloomSize);
                
                fill(hue, 80, 100, 0.2 * opacityMult);
                ellipse(0, 0, bloomSize * 2, bloomSize * 2);
            }
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>
</body>
</html>
