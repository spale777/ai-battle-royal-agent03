<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zen Garden - Generative Thought</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0a0a0a;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border: 1px solid #00ffcc;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
            max-width: 300px;
            backdrop-filter: blur(5px);
        }
        h1 {
            font-size: 1.2rem;
            margin: 0 0 15px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        input {
            background: #1a1a1a;
            border: 1px solid #00ffcc;
            color: #00ffcc;
            padding: 8px;
            font-family: inherit;
            outline: none;
        }
        input:focus {
            box-shadow: 0 0 5px #00ffcc;
        }
        button {
            background: #00ffcc;
            color: #0a0a0a;
            border: none;
            padding: 8px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
            transition: background 0.3s;
        }
        button:hover {
            background: #00cca3;
        }
        #status {
            margin-top: 10px;
            font-size: 0.8rem;
            min-height: 1.2em;
        }
        .nav-link {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: #00ffcc;
            text-decoration: none;
            font-size: 0.8rem;
            border: 1px solid #00ffcc;
            padding: 5px 10px;
            transition: all 0.3s;
            background: rgba(0, 0, 0, 0.5);
        }
        .nav-link:hover {
            background: #00ffcc;
            color: #0a0a0a;
        }
        #thought-display {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            font-style: italic;
            opacity: 0.7;
            max-width: 80%;
            pointer-events: none;
            transition: opacity 1s;
        }
    </style>
</head>
<body>
    <div id="ui-layer">
        <h1>Zen Garden</h1>
        <div class="input-group">
            <input type="text" id="seedInput" placeholder="Plant a thought...">
            <button id="plantBtn">PLANT SEED</button>
        </div>
        <div id="status"></div>
    </div>
    <div id="thought-display"></div>
    <a href="/" class="nav-link">← Return to Archive</a>

    <script>
        let seeds = [];
        let currentSeed = "";
        let canvas;
        let targetRotation = 0;
        let currentRotation = 0;

        async function fetchSeeds() {
            try {
                const response = await fetch('/api/seeds');
                seeds = await response.json();
                if (seeds.length > 0) {
                    updateCurrentSeed(seeds[seeds.length - 1].text);
                }
            } catch (e) {
                console.error("Failed to fetch seeds", e);
            }
        }

        function updateCurrentSeed(text) {
            currentSeed = text;
            const display = document.getElementById('thought-display');
            display.style.opacity = 0;
            setTimeout(() => {
                display.innerText = `"${text}"`;
                display.style.opacity = 0.7;
            }, 500);
        }

        async function plantSeed() {
            const input = document.getElementById('seedInput');
            const status = document.getElementById('status');
            const text = input.value.trim();
            if (!text) return;

            status.innerText = "Planting...";
            try {
                const response = await fetch('/api/plant', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });
                if (response.ok) {
                    const newSeed = await response.json();
                    updateCurrentSeed(newSeed.text);
                    input.value = "";
                    status.innerText = "Seed planted!";
                    setTimeout(() => status.innerText = "", 3000);
                }
            } catch (e) {
                status.innerText = "Error planting seed.";
            }
        }

        function hashString(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = ((hash << 5) - hash) + str.charCodeAt(i);
                hash |= 0; 
            }
            return hash;
        }

        function setup() {
            canvas = createCanvas(windowWidth, windowHeight);
            fetchSeeds();
            document.getElementById('plantBtn').onclick = plantSeed;
            document.getElementById('seedInput').onkeypress = (e) => {
                if (e.key === 'Enter') plantSeed();
            };
        }

        function draw() {
            background(10, 10, 10, 40);
            if (!currentSeed) return;

            const h = hashString(currentSeed);
            translate(width / 2, height * 0.85);
            
            const branches = 4 + (Math.abs(h) % 4);
            const angle = (Math.PI / 6) + (Math.abs(h % 100) / 500);
            const length = height * 0.2 + (Math.abs(h % 100) * 0.5);
            const colorHue = Math.abs(h % 360);

            colorMode(HSB, 360, 100, 100, 1);
            stroke(colorHue, 70, 100, 0.6);
            strokeWeight(2);
            
            // Subtle sway
            let sway = sin(frameCount * 0.01) * 0.05;
            
            drawBranch(length, angle, branches, sway);
        }

        function drawBranch(len, angle, depth, sway) {
            line(0, 0, 0, -len);
            translate(0, -len);
            
            if (depth > 0) {
                push();
                rotate(angle + sway);
                drawBranch(len * 0.75, angle, depth - 1, sway);
                pop();
                
                push();
                rotate(-angle + sway);
                drawBranch(len * 0.75, angle, depth - 1, sway);
                pop();
            } else {
                // Draw a small "leaf" or flower at the tip
                noStroke();
                fill(hue(frameCount % 360), 80, 100, 0.8);
                ellipse(0, 0, 5, 5);
            }
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>
</body>
</html>
